<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Completar Registro — GraveCare</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-[#f7f9f8] min-h-screen py-10 px-4 text-[#191c1b]">

  <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100">
    <div class="bg-[#002d1a] text-white p-6 sm:p-8 text-center">
      <div class="flex justify-center mb-3">
        <img src="assets/logo.png" alt="GraveCare Logo" class="h-14 w-auto object-contain" onerror="this.onerror=null; this.src='assets/logo.webp';">
      </div>
      <h1 class="text-2xl sm:text-3xl font-bold tracking-tight">Crea tu Cuenta en GraveCare</h1>
      <p class="text-gray-300 text-sm mt-2">Completa tu clave de acceso para activar tu plan y gestionar tus sepulturas.</p>
    </div>

    <div class="p-6 sm:p-8">
      <div id="alertBox" style="display: none;" class="p-4 rounded-lg mb-6 text-sm font-medium"></div>

      <form id="registroForm" class="space-y-5">
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Nombres *</label>
            <input type="text" id="nombres" required class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-[#002d1a] outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Apellido Paterno *</label>
            <input type="text" id="apellidoPaterno" required class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-[#002d1a] outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Apellido Materno</label>
            <input type="text" id="apellidoMaterno" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-[#002d1a] outline-none">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">RUT / DNI *</label>
            <input type="text" id="rut" required placeholder="12.345.678-9" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-[#002d1a] outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Teléfono *</label>
            <input type="tel" id="telefono" required placeholder="+56 9 8256 6719" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-[#002d1a] outline-none">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Correo Electrónico *</label>
            <input type="email" id="email" required class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-[#002d1a] outline-none bg-gray-50">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Fecha de Nacimiento *</label>
            <input type="date" id="fechaNacimiento" required class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-[#002d1a] outline-none">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 bg-gray-50 p-4 rounded-xl border border-gray-200">
          <div>
            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Crear Contraseña *</label>
            <input type="password" id="contrasena" required minlength="6" placeholder="Mínimo 6 caracteres" class="w-full px-3 py-2.5 bg-white border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-[#002d1a] outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Confirmar Contraseña *</label>
            <input type="password" id="confirmarContrasena" required minlength="6" placeholder="Repite la contraseña" class="w-full px-3 py-2.5 bg-white border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-[#002d1a] outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Dirección (Calle y Número) *</label>
          <input type="text" id="direccion" required placeholder="Av. Ejemplo 1234, Depto 501" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-[#002d1a] outline-none">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Comuna *</label>
            <input type="text" id="comuna" required placeholder="Ej: Las Condes" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-[#002d1a] outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Región *</label>
            <input type="text" id="region" required placeholder="Ej: Metropolitana" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-[#002d1a] outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">País *</label>
            <input type="text" id="pais" value="Chile" required class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-[#002d1a] outline-none">
          </div>
        </div>

        <div class="pt-4">
          <button type="submit" id="submitBtn" class="w-full py-3.5 px-4 bg-[#002d1a] hover:bg-[#1a432f] text-white font-bold rounded-xl shadow-lg transition-all flex items-center justify-center gap-2 text-base cursor-pointer">
            <span>Completar Registro y Activar Cuenta</span>
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
          </button>
          
          <div id="loading" style="display: none;" class="items-center justify-center gap-2 mt-4 text-sm text-gray-500">
            <svg class="animate-spin h-5 w-5 text-[#002d1a]" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span>Creando cuenta y configurando servicios...</span>
          </div>
        </div>
      </form>

      <div class="mt-8 pt-6 border-t border-gray-100">
        <details class="text-xs text-gray-400">
          <summary class="cursor-pointer hover:text-gray-600">Ver registro de depuración (Debug Info)</summary>
          <div id="debugInfo" class="mt-2 p-3 bg-gray-900 text-emerald-400 rounded-lg font-mono text-[11px] overflow-x-auto max-h-48 overflow-y-auto"></div>
        </details>
      </div>
    </div>
  </div>

  <footer class="text-center text-xs text-gray-500 mt-8 mb-4">
    GraveCare SpA · Preservación & Memoria · contacto@gravecare.cl
  </footer>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
    import { getAuth, createUserWithEmailAndPassword, updateProfile } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';
    import { getFirestore, getDoc, setDoc, doc, collection, query, where, getDocs, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyAthgIWiVPDuscljVjQRAX-vIeUYLbrSC0",
      authDomain: "gravecare-2e8d2.firebaseapp.com",
      projectId: "gravecare-2e8d2",
      storageBucket: "gravecare-2e8d2.firebasestorage.app",
      messagingSenderId: "160012946248",
      appId: "1:160012946248:web:8c3e73100f1e92c485c17d"
    };

    const logs = [];
    function addLog(msg) {
      const timestamp = new Date().toLocaleTimeString();
      logs.push(`[${timestamp}] ${msg}`);
      console.log(msg);
      const debugInfo = document.getElementById('debugInfo');
      if (debugInfo) {
        debugInfo.innerHTML = logs.join('<br>');
      }
    }

    try {
      addLog('🔥 Inicializando Firebase...');
      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);
      addLog('✅ Firebase inicializado');

      let ordenIdDetectada = null;

      async function rescatarDatosFirebase() {
        // 1. Revisar de forma exhaustiva los almacenamientos locales
        const storageKeys = [
          'gravecare_datos_completos',
          'gravecare_last_order',
          'gravecare_registro_datos',
          'gravecare_nueva_orden',
          'gravecare_orden_pendiente'
        ];

        for (const k of storageKeys) {
          const raw = sessionStorage.getItem(k) || localStorage.getItem(k);
          if (raw) {
            try {
              const p = JSON.parse(raw);
              if (p && (p.titular || p.email || p.emailCliente || p.nombres || p.nombreCompleto)) {
                addLog(`✅ Datos encontrados en storage clave: ${k}`);
                if (p.numeroOrden || p.id) ordenIdDetectada = p.numeroOrden || p.id;
                return p;
              }
            } catch(e) {}
          }
        }

        // 2. Revisar parámetros de la URL
        const urlParams = new URLSearchParams(window.location.search);
        const idParam = urlParams.get('id') || urlParams.get('orden') || urlParams.get('ordenId');
        const emailParam = urlParams.get('email');

        if (idParam) {
          ordenIdDetectada = idParam;
          try {
            // Consulta directa por ID de documento
            let snap = await getDoc(doc(db, 'ordenes', idParam));
            if (snap.exists()) {
              addLog(`✅ Orden encontrada por Document ID: ${idParam}`);
              return snap.data();
            }

            // Consulta por campo numeroOrden
            const qNum = query(collection(db, 'ordenes'), where('numeroOrden', '==', idParam));
            const snapNum = await getDocs(qNum);
            if (!snapNum.empty) {
              addLog(`✅ Orden encontrada por campo numeroOrden: ${idParam}`);
              return snapNum.docs[0].data();
            }
          } catch (e) {
            addLog(`⚠️ Error búsqueda ID: ${e.message}`);
          }
        }

        if (emailParam) {
          try {
            const cleanEmail = decodeURIComponent(emailParam).trim().toLowerCase();
            let q = query(collection(db, 'ordenes'), where('titular.email', '==', cleanEmail));
            let snapEmail = await getDocs(q);

            if (snapEmail.empty) {
              q = query(collection(db, 'ordenes'), where('emailCliente', '==', cleanEmail));
              snapEmail = await getDocs(q);
            }

            if (!snapEmail.empty) {
              addLog(`✅ Datos encontrados por Email en Firestore`);
              ordenIdDetectada = snapEmail.docs[0].id;
              return snapEmail.docs[0].data();
            }
          } catch (e) {
            addLog(`⚠️ Error búsqueda Email: ${e.message}`);
          }
        }

        addLog('ℹ️ Sin registros previos vinculados');
        return null;
      }

      function poblarFormulario(datos) {
        if (!datos) return;

        const titular = datos.titular || {};
        const dir = datos.direccionTitular || {};

        // Manejo inteligente de nombres y apellidos si venían concatenados
        let nombresVal = datos.nombres || titular.nombres || '';
        let apPatVal = datos.apellidoPaterno || titular.apellidoPaterno || '';
        let apMatVal = datos.apellidoMaterno || titular.apellidoMaterno || '';

        if (!nombresVal) {
          const nombreCompleto = datos.nombreCompleto || titular.nombreCompleto || datos.nombre || titular.nombre || '';
          if (nombreCompleto) {
            const partes = nombreCompleto.trim().split(/\s+/);
            if (partes.length === 1) {
              nombresVal = partes[0];
            } else if (partes.length === 2) {
              nombresVal = partes[0];
              apPatVal = partes[1];
            } else if (partes.length === 3) {
              nombresVal = partes[0];
              apPatVal = partes[1];
              apMatVal = partes[2];
            } else {
              nombresVal = partes.slice(0, 2).join(' ');
              apPatVal = partes[2] || '';
              apMatVal = partes.slice(3).join(' ') || '';
            }
          }
        }

        // Manejo de dirección
        let direccionFormateada = datos.direccion || dir.direccion || titular.direccion || '';
        const numCalle = dir.numero || titular.numero || '';
        const deptoCalle = dir.departamento || titular.departamento || '';

        if (numCalle && !direccionFormateada.includes(numCalle)) {
          direccionFormateada += ` ${numCalle}`;
        }
        if (deptoCalle && !direccionFormateada.includes(deptoCalle)) {
          direccionFormateada += `, ${deptoCalle}`;
        }

        const correoRescatado = titular.email || datos.emailCliente || datos.email || titular.emailCliente || '';
        const rutRescatado = datos.rut || titular.rut || titular.rutDni || datos.rutDni || '';
        const telefonoRescatado = datos.telefono || titular.telefono || '';
        const comunaRescatada = datos.comuna || dir.comuna || titular.comuna || '';
        const regionRescatada = datos.region || dir.region || titular.region || 'Metropolitana';
        const paisRescatado = datos.pais || dir.pais || titular.pais || 'Chile';

        const valores = {
          nombres: nombresVal,
          apellidoPaterno: apPatVal,
          apellidoMaterno: apMatVal,
          email: correoRescatado,
          telefono: telefonoRescatado,
          rut: rutRescatado,
          direccion: direccionFormateada.trim(),
          comuna: comunaRescatada,
          region: regionRescatada,
          pais: paisRescatado,
          fechaNacimiento: datos.fechaNacimiento || titular.fechaNacimiento || ''
        };

        Object.keys(valores).forEach(id => {
          const elem = document.getElementById(id);
          if (elem && valores[id]) {
            elem.value = valores[id];
            addLog(`  ✓ ${id}: ${valores[id]}`);
            
            // Si el dato ya fue completado en el proceso de compra, dejarlo listo
            if (typeof valores[id] === 'string' && valores[id].trim() !== '') {
              elem.classList.add('bg-gray-50');
            }
          }
        });

        // Foco automático en el campo que falta
        const fechaEl = document.getElementById('fechaNacimiento');
        if (fechaEl && !fechaEl.value) {
          fechaEl.focus();
        } else {
          document.getElementById('contrasena').focus();
        }
      }

      function showAlert(message, type) {
        const alertBox = document.getElementById("alertBox");
        if (!alertBox) return;
        alertBox.className = `p-4 rounded-lg mb-4 text-sm font-medium ${
          type === "error" ? "bg-red-100 text-red-800 border border-red-200" :
          type === "warning" ? "bg-amber-100 text-amber-900 border border-amber-300" :
          "bg-green-100 text-green-800 border border-green-200"
        }`;
        alertBox.innerHTML = message;
        alertBox.style.display = "block";
      }

      async function iniciarRegistro() {
        const datosEncontrados = await rescatarDatosFirebase();
        poblarFormulario(datosEncontrados);

        const form = document.getElementById("registroForm");
        const submitBtn = document.getElementById("submitBtn");
        const loading = document.getElementById("loading");

        form.addEventListener("submit", async (e) => {
          e.preventDefault();

          const email = document.getElementById("email").value.trim().toLowerCase();
          const contrasena = document.getElementById("contrasena").value;
          const confirmarContrasena = document.getElementById("confirmarContrasena").value;
          const fechaNacimiento = document.getElementById("fechaNacimiento").value;

          if (!fechaNacimiento) {
            showAlert("❌ Debes ingresar tu fecha de nacimiento", "error");
            return;
          }
          if (contrasena !== confirmarContrasena) {
            showAlert("❌ Las contraseñas no coinciden", "error");
            return;
          }
          if (contrasena.length < 6) {
            showAlert("❌ La contraseña debe tener mínimo 6 caracteres", "error");
            return;
          }

          submitBtn.disabled = true;
          if (loading) loading.style.display = "flex";

          try {
            addLog(`👤 Creando usuario Auth para: ${email}...`);
            const userCredential = await createUserWithEmailAndPassword(auth, email, contrasena);
            const user = userCredential.user;
            const uid = user.uid;

            const nombres = document.getElementById("nombres").value.trim();
            const apPaterno = document.getElementById("apellidoPaterno").value.trim();
            const apMaterno = document.getElementById("apellidoMaterno").value.trim();
            const nombreCompleto = `${nombres} ${apPaterno} ${apMaterno}`.trim();

            await updateProfile(user, { displayName: nombreCompleto });

            const sesionDatos = JSON.parse(localStorage.getItem('gravecare_last_order') || '{}');
            const nombrePlanFinal = sesionDatos.planNombre || sesionDatos.servicio?.planNombre || 'Servicio Contratado';

            const userData = {
              uid,
              email,
              nombres,
              apellidoPaterno: apPaterno,
              apellidoMaterno: apMaterno,
              nombreCompleto,
              rut: document.getElementById("rut").value.trim(),
              telefono: document.getElementById("telefono").value.trim(),
              fechaNacimiento,
              direccion: document.getElementById("direccion").value.trim(),
              comuna: document.getElementById("comuna").value.trim(),
              region: document.getElementById("region").value.trim(),
              pais: document.getElementById("pais").value.trim(),
              rol: 'cliente',
              planNombre: nombrePlanFinal,
              estadoSuscripcion: 'Activo',
              createdAt: serverTimestamp(),
              lastLogin: serverTimestamp()
            };

            addLog('💾 Guardando perfil en Firestore (/usuarios)...');
            await setDoc(doc(db, 'usuarios', uid), userData, { merge: true });

            if (ordenIdDetectada) {
              addLog(`🔗 Vinculando orden ${ordenIdDetectada}...`);
              await setDoc(doc(db, 'ordenes', ordenIdDetectada), {
                usuarioId: uid,
                emailCliente: email,
                estado: 'Confirmado'
              }, { merge: true });
            }

            const cleanRut = userData.rut.toLowerCase().replace(/\./g, '').replace(/\s/g, '');
            if (cleanRut) {
              await setDoc(doc(db, 'rut_lookup', cleanRut), {
                rut: cleanRut,
                email,
                uid
              });
            }

            sessionStorage.removeItem('gravecare_registro_datos');
            localStorage.removeItem('gravecare_datos_completos');

            showAlert("✅ Cuenta creada y activada exitosamente. Redirigiendo...", "success");

            setTimeout(() => {
              window.location.href = "dashboard.html";
            }, 1500);

          } catch (error) {
            addLog(`❌ Error: ${error.message}`);
            if (error.code === 'auth/email-already-in-use') {
              let segundos = 3;
              showAlert(`
                <div class="flex items-center gap-2">
                  <span>⚠️ <strong>Este correo ya tiene una cuenta activa.</strong> Redirigiendo a iniciar sesión en <span id="cuentaRegresiva" class="font-bold underline">${segundos}</span> segundos...</span>
                </div>
              `, "warning");

              const interval = setInterval(() => {
                segundos--;
                const cuentaSpan = document.getElementById("cuentaRegresiva");
                if (cuentaSpan) cuentaSpan.textContent = segundos;

                if (segundos <= 0) {
                  clearInterval(interval);
                  window.location.href = `login.html?email=${encodeURIComponent(email)}`;
                }
              }, 1000);
            } else {
              showAlert(`❌ Error: ${error.message}`, "error");
              submitBtn.disabled = false;
            }
          } finally {
            if (loading) loading.style.display = "none";
          }
        });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', iniciarRegistro);
      } else {
        iniciarRegistro();
      }

    } catch (error) {
      console.error(`❌ ERROR CRÍTICO: ${error.message}`);
    }
  </script>
</body>
</html>
