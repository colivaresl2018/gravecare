<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Completar Registro — GraveCare</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen py-10 px-4">

  <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100">
    <!-- Encabezado -->
    <div class="bg-slate-900 text-white p-6 sm:p-8 text-center">
      <h1 class="text-2xl sm:text-3xl font-bold tracking-tight">Crea tu Cuenta en GraveCare</h1>
      <p class="text-slate-400 text-sm mt-2">Completa tu clave de acceso para activar tu plan y gestionar tus sepulturas.</p>
    </div>

    <!-- Contenedor del Formulario -->
    <div class="p-6 sm:p-8">
      <!-- Alertas -->
      <div id="alertBox" style="display: none;" class="p-4 rounded-lg mb-6 text-sm font-medium"></div>

      <form id="registroForm" class="space-y-6">
        <!-- Nombres y Apellidos -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Nombres *</label>
            <input type="text" id="nombres" required class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Apellido Paterno *</label>
            <input type="text" id="apellidoPaterno" required class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Apellido Materno</label>
            <input type="text" id="apellidoMaterno" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none">
          </div>
        </div>

        <!-- RUT y Teléfono -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-gray-600 uppercase mb-1">RUT / DNI *</label>
            <input type="text" id="rut" required placeholder="12.345.678-9" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Teléfono *</label>
            <input type="tel" id="telefono" required placeholder="+56 9 1234 5678" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none">
          </div>
        </div>

        <!-- Correo y Fecha Nacimiento -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Correo Electrónico *</label>
            <input type="email" id="email" required class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none bg-gray-50">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Fecha de Nacimiento *</label>
            <input type="date" id="fechaNacimiento" required class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none">
          </div>
        </div>

        <!-- Contraseñas -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 bg-slate-50 p-4 rounded-xl border border-slate-200">
          <div>
            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Crear Contraseña *</label>
            <input type="password" id="contrasena" required minlength="6" placeholder="Mínimo 6 caracteres" class="w-full px-3 py-2.5 bg-white border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Confirmar Contraseña *</label>
            <input type="password" id="confirmarContrasena" required minlength="6" placeholder="Repite la contraseña" class="w-full px-3 py-2.5 bg-white border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none">
          </div>
        </div>

        <!-- Dirección -->
        <div>
          <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Dirección (Calle y Número) *</label>
          <input type="text" id="direccion" required placeholder="Av. Ejemplo 1234, Depto 501" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Comuna *</label>
            <input type="text" id="comuna" required placeholder="Ej: Las Condes" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Región *</label>
            <input type="text" id="region" required placeholder="Ej: Metropolitana" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-600 uppercase mb-1">País *</label>
            <input type="text" id="pais" value="Chile" required class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none">
          </div>
        </div>

        <!-- Términos -->
        <div class="flex items-center gap-2 pt-2">
          <input type="checkbox" id="aceptoTerminos" required class="h-4 w-4 text-emerald-600 focus:ring-emerald-500 border-gray-300 rounded">
          <label for="aceptoTerminos" class="text-xs text-gray-600">Acepto los <a href="#" class="text-emerald-600 font-semibold underline">Términos y Condiciones</a> del servicio GraveCare.</label>
        </div>

        <!-- Botón de Envío y Loading -->
        <div class="pt-4">
          <button type="submit" id="submitBtn" class="w-full py-3.5 px-4 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl shadow-lg shadow-emerald-600/30 transition-all flex items-center justify-center gap-2 text-base cursor-pointer">
            <span>Completar Registro y Activar Cuenta</span>
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
          </button>
          
          <div id="loading" style="display: none;" class="items-center justify-center gap-2 mt-4 text-sm text-gray-500">
            <svg class="animate-spin h-5 w-5 text-emerald-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span>Creando cuenta y configurando servicios...</span>
          </div>
        </div>
      </form>

      <!-- Panel de Depuración Opcional -->
      <div class="mt-8 pt-6 border-t border-gray-100">
        <details class="text-xs text-gray-400">
          <summary class="cursor-pointer hover:text-gray-600">Ver registro de depuración (Debug Info)</summary>
          <div id="debugInfo" class="mt-2 p-3 bg-gray-900 text-emerald-400 rounded-lg font-mono text-[11px] overflow-x-auto max-h-48 overflow-y-auto"></div>
        </details>
      </div>
    </div>
  </div>

  <!-- Script Firebase Unificado -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
    import { getAuth, createUserWithEmailAndPassword, updateProfile } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';
    import { getFirestore, getDoc, setDoc, doc, collection, query, where, getDocs, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyAthgIWiVPDuscljVjQRAX-vIeUYLbrSC0",
      authDomain: "gravecare-2e8d2.firebaseapp.com",
      projectId: "gravecare-2e8d2",
      storageBucket: "gravecare-2e8d2.appspot.com",
      messagingSenderId: "160012946248",
      appId: "1:160012946248:web:8c3e73100f1e92c485c17d"
    };

    const logs = [];
    function addLog(msg) {
      const timestamp = new Date().toLocaleTimeString();
      logs.push(`[${timestamp}] ${msg}`);
      console.log(msg);
      const debugInfo = document.getElementById('debugInfo');
      if (debugInfo) {
        debugInfo.innerHTML = logs.join('<br>');
      }
    }

    try {
      addLog('🔥 Inicializando Firebase...');
      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);
      addLog('✅ Firebase inicializado');

      let ordenIdDetectada = null;

      // ============ RESCATAR DATOS DESDE FIREBASE FIRESTORE ============
      async function rescatarDatosFirebase() {
        const urlParams = new URLSearchParams(window.location.search);
        const idParam = urlParams.get('id') || urlParams.get('orden');
        const emailParam = urlParams.get('email');
        const rutParam = urlParams.get('rut');

        addLog(`🔍 Analizando parámetros URL: id=${idParam}, email=${emailParam}, rut=${rutParam}`);

        // 1. Buscar en colección 'ordenes' o 'solicitudes' por ID
        if (idParam) {
          ordenIdDetectada = idParam;
          try {
            let snap = await getDoc(doc(db, 'ordenes', idParam));
            if (!snap.exists()) {
              snap = await getDoc(doc(db, 'solicitudes', idParam));
            }
            if (snap.exists()) {
              addLog(`✅ Datos encontrados por ID: ${idParam}`);
              return snap.data();
            }
          } catch (e) {
            addLog(`⚠️ Error búsqueda ID: ${e.message}`);
          }
        }

        // 2. Buscar en 'ordenes' por Email
        if (emailParam) {
          try {
            const cleanEmail = decodeURIComponent(emailParam).trim().toLowerCase();
            const q = query(collection(db, 'ordenes'), where('emailCliente', '==', cleanEmail));
            const snapEmail = await getDocs(q);
            if (!snapEmail.empty) {
              addLog(`✅ Datos de orden encontrados por Email`);
              ordenIdDetectada = snapEmail.docs[0].id;
              return snapEmail.docs[0].data();
            }
          } catch (e) {
            addLog(`⚠️ Error búsqueda Email: ${e.message}`);
          }
        }

        // 3. Fallback a almacenamiento local
        const local = sessionStorage.getItem('gravecare_registro_datos') ||
                      localStorage.getItem('gravecare_datos_completos') ||
                      localStorage.getItem('gravecare_last_order');
        if (local) {
          addLog('ℹ️ Usando respaldo desde almacenamiento local');
          return JSON.parse(local);
        }

        addLog('ℹ️ Sin registros previos vinculados');
        return null;
      }

      // ============ PRELLENAR Y BLOQUEAR CAMPOS ============
      function poblarFormulario(datos) {
        if (!datos) return;

        const titular = datos.titular || {};
        const dir = datos.direccionTitular || {};

        const valores = {
          nombres: datos.nombres || titular.nombres || datos.nombre || '',
          apellidoPaterno: datos.apellidoPaterno || titular.apellidoPaterno || '',
          apellidoMaterno: datos.apellidoMaterno || titular.apellidoMaterno || '',
          email: datos.email || datos.emailCliente || titular.email || '',
          telefono: datos.telefono || titular.telefono || '',
          rut: datos.rut || titular.rutDni || titular.rut || '',
          direccion: datos.direccion || dir.direccion || '',
          comuna: datos.comuna || dir.comuna || '',
          region: datos.region || dir.region || '',
          pais: datos.pais || dir.pais || 'Chile',
          fechaNacimiento: datos.fechaNacimiento || ''
        };

        const camposBloqueables = ['nombres', 'apellidoPaterno', 'apellidoMaterno', 'email', 'rut', 'telefono', 'direccion', 'comuna', 'region', 'pais'];

        Object.keys(valores).forEach(id => {
          const elem = document.getElementById(id);
          if (elem && valores[id]) {
            elem.value = valores[id];
            addLog(`  ✓ ${id}: ${valores[id]}`);
            
            if (camposBloqueables.includes(id)) {
              elem.readOnly = true;
              elem.classList.add('bg-gray-100', 'text-gray-700', 'cursor-not-allowed');
            }
          }
        });

        const fechaEl = document.getElementById('fechaNacimiento');
        if (fechaEl && !fechaEl.value) {
          fechaEl.focus();
        } else {
          document.getElementById('contrasena').focus();
        }
      }

      function showAlert(message, type) {
        const alertBox = document.getElementById("alertBox");
        if (!alertBox) return;
        alertBox.className = `p-4 rounded-lg mb-4 text-sm font-medium ${
          type === "error" ? "bg-red-100 text-red-800 border border-red-200" : "bg-green-100 text-green-800 border border-green-200"
        }`;
        alertBox.innerHTML = message;
        alertBox.style.display = "block";
      }

      // ============ PROCESO DE REGISTRO ============
      async function iniciarRegistro() {
        const datosEncontrados = await rescatarDatosFirebase();
        poblarFormulario(datosEncontrados);

        const form = document.getElementById("registroForm");
        const submitBtn = document.getElementById("submitBtn");
        const loading = document.getElementById("loading");

        form.addEventListener("submit", async (e) => {
          e.preventDefault();

          const email = document.getElementById("email").value.trim().toLowerCase();
          const contrasena = document.getElementById("contrasena").value;
          const confirmarContrasena = document.getElementById("confirmarContrasena").value;
          const fechaNacimiento = document.getElementById("fechaNacimiento").value;

          if (!fechaNacimiento) {
            showAlert("❌ Debes ingresar tu fecha de nacimiento", "error");
            return;
          }
          if (contrasena !== confirmarContrasena) {
            showAlert("❌ Las contraseñas no coinciden", "error");
            return;
          }
          if (contrasena.length < 6) {
            showAlert("❌ La contraseña debe tener mínimo 6 caracteres", "error");
            return;
          }

          submitBtn.disabled = true;
          if (loading) loading.style.display = "flex";

          try {
            // 1. Crear usuario en Firebase Authentication
            addLog(`👤 Creando usuario Auth para: ${email}...`);
            const userCredential = await createUserWithEmailAndPassword(auth, email, contrasena);
            const user = userCredential.user;
            const uid = user.uid;

            const nombres = document.getElementById("nombres").value.trim();
            const apPaterno = document.getElementById("apellidoPaterno").value.trim();
            const apMaterno = document.getElementById("apellidoMaterno").value.trim();
            const nombreCompleto = `${nombres} ${apPaterno} ${apMaterno}`.trim();

            await updateProfile(user, { displayName: nombreCompleto });

            // 2. Extraer nombre de plan de la orden previa
            const sesionDatos = JSON.parse(localStorage.getItem('gravecare_last_order') || '{}');
            const nombrePlanFinal = sesionDatos.planNombre || 'Servicio Spot';

            // 3. Consolidar documento en colección 'usuarios'
            const userData = {
              uid,
              email,
              nombres,
              apellidoPaterno: apPaterno,
              apellidoMaterno: apMaterno,
              nombreCompleto,
              rut: document.getElementById("rut").value.trim(),
              telefono: document.getElementById("telefono").value.trim(),
              fechaNacimiento,
              direccion: document.getElementById("direccion").value.trim(),
              comuna: document.getElementById("comuna").value.trim(),
              region: document.getElementById("region").value.trim(),
              pais: document.getElementById("pais").value.trim(),
              rol: 'cliente',
              planNombre: nombrePlanFinal,
              estadoSuscripcion: 'Activo',
              createdAt: serverTimestamp(),
              lastLogin: serverTimestamp()
            };

            addLog('💾 Guardando perfil en Firestore (/usuarios)...');
            await setDoc(doc(db, 'usuarios', uid), userData, { merge: true });

            // 4. Si vino con orden vinculada, actualizarla con el uid final
            if (ordenIdDetectada) {
              addLog(`🔗 Vinculando orden ${ordenIdDetectada}...`);
              await setDoc(doc(db, 'ordenes', ordenIdDetectada), {
                usuarioId: uid,
                emailCliente: email,
                estado: 'Confirmado'
              }, { merge: true });
            }

            // 5. Crear índice para login por RUT
            const cleanRut = userData.rut.toLowerCase().replace(/\./g, '').replace(/\s/g, '');
            if (cleanRut) {
              await setDoc(doc(db, 'rut_lookup', cleanRut), {
                rut: cleanRut,
                email,
                uid
              });
            }

            // 6. Limpieza y redirección directa al dashboard
            sessionStorage.removeItem('gravecare_registro_datos');
            localStorage.removeItem('gravecare_datos_completos');

            showAlert("✅ Cuenta creada y activada exitosamente. Redirigiendo...", "success");

            setTimeout(() => {
              window.location.href = "dashboard.html";
            }, 1500);

          } catch (error) {
            addLog(`❌ Error: ${error.message}`);
            if (error.code === 'auth/email-already-in-use') {
              showAlert("⚠️ Este correo ya tiene una cuenta activa. Inicia sesión en su lugar.", "error");
            } else {
              showAlert(`❌ Error: ${error.message}`, "error");
            }
          } finally {
            submitBtn.disabled = false;
            if (loading) loading.style.display = "none";
          }
        });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', iniciarRegistro);
      } else {
        iniciarRegistro();
      }

    } catch (error) {
      console.error(`❌ ERROR CRÍTICO: ${error.message}`);
    }
  </script>
</body>
</html>
