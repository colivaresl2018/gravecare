<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmando Inscripción Oneclick — GraveCare</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <!-- Firebase SDKs compat -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-[#f8faf8] text-[#191c1b] min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-white rounded-3xl p-8 shadow-xl border border-gray-100 text-center">
    <!-- Spinner / Icono de Estado -->
    <div id="contenedorIcono" class="w-16 h-16 mx-auto mb-6 flex items-center justify-center rounded-full bg-emerald-100 text-[#002d1a]">
      <span id="iconoEstado" class="material-symbols-outlined text-3xl animate-spin">progress_activity</span>
    </div>

    <h1 id="tituloEstado" class="text-2xl font-bold text-[#002d1a] mb-2">Confirmando inscripción...</h1>
    <p id="mensajeEstado" class="text-sm text-gray-600 mb-6 leading-relaxed">
      Estamos validando tu tarjeta con Transbank de manera segura. Por favor, no cierres esta ventana.
    </p>

    <!-- Botón de redirección manual si tarda -->
    <div id="contenedorBoton" style="display: none;">
      <a id="btnContinuar" href="index.html" class="inline-block w-full py-3 px-6 bg-[#002d1a] hover:bg-[#1a432f] text-white font-bold rounded-xl shadow-md transition-all text-sm">
        Continuar
      </a>
    </div>
  </div>

  <script>
    // Inicializar Firebase
    let db = null;
    try {
      if (!firebase.apps.length) {
        firebase.initializeApp({ projectId: "gravecare-2e8d2" });
      }
      db = firebase.firestore();
    } catch(e) {
      console.warn("Firestore init:", e);
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('TBK_TOKEN') || urlParams.get('token');
      const ordenId = urlParams.get('ordenId') || urlParams.get('orden');

      const icono = document.getElementById('iconoEstado');
      const contenedorIcono = document.getElementById('contenedorIcono');
      const titulo = document.getElementById('tituloEstado');
      const mensaje = document.getElementById('mensajeEstado');
      const contenedorBoton = document.getElementById('contenedorBoton');
      const btnContinuar = document.getElementById('btnContinuar');

      if (!token) {
        icono.classList.remove('animate-spin');
        icono.textContent = 'error';
        contenedorIcono.className = "w-16 h-16 mx-auto mb-6 flex items-center justify-center rounded-full bg-red-100 text-red-600";
        titulo.textContent = 'Inscripción cancelada';
        mensaje.textContent = 'No se recibió la confirmación de Transbank o el proceso fue interrumpido.';
        btnContinuar.href = 'resumen-pago.html';
        btnContinuar.textContent = 'Volver al pago';
        contenedorBoton.style.display = 'block';
        return;
      }

      try {
        // 1. Confirmar con la Cloud Function finish de Oneclick
        const res = await fetch(`/confirmarInscripcionOneclick?token=${encodeURIComponent(token)}&ordenId=${encodeURIComponent(ordenId || '')}`, {
          method: 'GET'
        });

        const data = await res.json();

        if (!data.success && data.response_code !== 0) {
          throw new Error(data.message || 'La tarjeta fue rechazada o no pudo ser inscrita.');
        }

        // 2. Verificar RUT en Firestore para decidir destino (login vs registro)
        let rutCliente = '';
        let ordenData = null;

        if (db && ordenId) {
          try {
            const ordSnap = await db.collection('ordenes').doc(ordenId).get();
            if (ordSnap.exists) {
              ordenData = ordSnap.data();
              rutCliente = ordenData.titular?.rut || ordenData.rut || ordenData.rutCliente || '';
            }
          } catch(e) {
            console.warn("Error leyendo orden:", e);
          }
        }

        // Si no vino de la base de datos, buscar en localStorage
        if (!rutCliente) {
          const localStr = localStorage.getItem('gravecare_datos_completos') || sessionStorage.getItem('gravecare_registro_datos');
          if (localStr) {
            try {
              const parsed = JSON.parse(localStr);
              rutCliente = parsed.titular?.rut || parsed.rut || '';
            } catch(e) {}
          }
        }

        let usuarioExiste = false;

        if (db && rutCliente) {
          const rutLimpio = String(rutCliente).replace(/[^0-9kK]/g, '').toUpperCase();
          try {
            // Verificar en coleccion usuarios
            const userSnap = await db.collection('usuarios').where('rut', '==', rutCliente).limit(1).get();
            if (!userSnap.empty) {
              usuarioExiste = true;
            } else {
              // Verificar en rut_lookup si existe
              const lookupSnap = await db.collection('rut_lookup').doc(rutLimpio).get();
              if (lookupSnap.exists) usuarioExiste = true;
            }
          } catch(e) {
            console.warn("Verificando existencia usuario:", e);
          }
        }

        // 3. Éxito y Redirección
        icono.classList.remove('animate-spin');
        icono.textContent = 'check_circle';
        contenedorIcono.className = "w-16 h-16 mx-auto mb-6 flex items-center justify-center rounded-full bg-emerald-100 text-emerald-600";
        titulo.textContent = '¡Inscripción Exitosa!';
        
        let destino = '';
        if (usuarioExiste) {
          mensaje.textContent = 'Tu tarjeta quedó inscrita y tu cuenta ya existe. Redirigiéndote al inicio de sesión...';
          destino = `login.html?ordenId=${encodeURIComponent(ordenId || '')}&oneclick=1`;
        } else {
          mensaje.textContent = 'Tarjeta inscrita con éxito. Redirigiéndote para crear tu contraseña...';
          destino = `registro.html?ordenId=${encodeURIComponent(ordenId || '')}&rut=${encodeURIComponent(rutCliente)}&oneclick=1`;
        }

        btnContinuar.href = destino;
        btnContinuar.textContent = usuarioExiste ? 'Ir a Iniciar Sesión' : 'Completar Registro';
        contenedorBoton.style.display = 'block';

        // Redirección automática tras 1.5 segundos
        setTimeout(() => {
          window.location.href = destino;
        }, 1500);

      } catch (err) {
        console.error('Error en confirmación:', err);
        icono.classList.remove('animate-spin');
        icono.textContent = 'cancel';
        contenedorIcono.className = "w-16 h-16 mx-auto mb-6 flex items-center justify-center rounded-full bg-red-100 text-red-600";
        titulo.textContent = 'No se pudo completar la inscripción';
        mensaje.textContent = err.message || 'Ocurrió un error al procesar tu tarjeta en Transbank.';
        btnContinuar.href = 'resumen-pago.html';
        btnContinuar.textContent = 'Reintentar inscripción';
        contenedorBoton.style.display = 'block';
      }
    });
  </script>
</body>
</html>
