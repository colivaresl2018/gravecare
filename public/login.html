<!DOCTYPE html>
<html class="light" lang="es">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>GraveCare - Iniciar Sesión</title>
  
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "background": "#f8faf8",
            "surface-container-lowest": "#ffffff",
            "primary": "#002d1a",
            "secondary": "#4e6451",
            "primary-container": "#1a432f"
          }
        }
      }
    };
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col">

  <header class="bg-white/90 backdrop-blur-md border-b border-gray-200 sticky top-0 z-50">
    <div class="flex justify-between items-center w-full px-6 max-w-6xl mx-auto h-20">
      <a href="dashboard.html" class="flex items-center gap-2">
        <img src="/assets/Logo.jpg" alt="GraveCare Logo" class="h-12 w-auto object-contain">
      </a>
      <a href="registro.html" class="text-sm font-semibold text-primary hover:underline">¿No tienes cuenta? Regístrate</a>
    </div>
  </header>

  <main class="flex-grow flex items-center justify-center relative overflow-hidden px-4 py-12">
    <div class="relative z-10 w-full max-w-md">
      <div class="bg-white rounded-2xl border border-gray-200 shadow-xl p-8 md:p-10 flex flex-col items-center">
        
        <div class="text-center mb-6 w-full">
          <h1 class="text-2xl font-bold text-primary mb-2">Ingreso a Mi Perfil</h1>
          <p class="text-sm text-gray-600">Ingresa con tu RUT o Correo Electrónico</p>
        </div>

        <!-- Alertas -->
        <div id="alert-error" class="w-full p-3 mb-4 text-sm text-red-700 bg-red-100 rounded-lg border border-red-200" style="display: none;"></div>
        <div id="alert-success" class="w-full p-3 mb-4 text-sm text-green-700 bg-green-100 rounded-lg border border-green-200" style="display: none;"></div>

        <form id="form-login" class="w-full space-y-5" novalidate>
          
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1" for="rut">RUT o Correo Electrónico</label>
            <div class="relative">
              <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">badge</span>
              <input class="w-full pl-10 pr-4 py-3 rounded-lg border border-gray-300 text-gray-900 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent text-sm" id="rut" name="rut" placeholder="12.345.678-K o correo@ejemplo.com" type="text" required autocomplete="username">
            </div>
          </div>

          <div>
            <div class="flex justify-between items-center mb-1">
              <label class="block text-sm font-semibold text-gray-700" for="password">Contraseña</label>
              <a href="https://wa.me/56998280501?text=Hola%20GraveCare,%20olvidé%20mi%20contraseña" target="_blank" class="text-xs text-primary font-semibold hover:underline">¿Olvidaste tu clave?</a>
            </div>
            <div class="relative">
              <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">lock</span>
              <input class="w-full pl-10 pr-4 py-3 rounded-lg border border-gray-300 text-gray-900 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent text-sm" id="password" name="password" placeholder="••••••••" type="password" required autocomplete="current-password">
            </div>
          </div>

          <button type="submit" id="btn-login" class="w-full bg-primary text-white font-semibold py-3.5 px-6 rounded-lg shadow-md hover:bg-primary-container transition-colors duration-300 flex justify-center items-center gap-2 text-sm cursor-pointer">
            <span>Ingresar</span>
            <span class="material-symbols-outlined text-sm">arrow_forward</span>
          </button>
        </form>

        <div class="mt-6 text-center text-sm text-gray-600">
          ¿Aún no tienes cuenta? <a href="registro.html" class="text-primary font-bold hover:underline">Regístrate aquí</a>
        </div>

      </div>
    </div>
  </main>

  <!-- Script Firebase Autónomo (Sin imports relativos rotos) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, collection, query, where, getDocs, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAthgIWiVPDuscljVjQRAX-vIeUYLbrSC0",
      authDomain: "gravecare-2e8d2.firebaseapp.com",
      projectId: "gravecare-2e8d2",
      storageBucket: "gravecare-2e8d2.appspot.com",
      messagingSenderId: "160012946248",
      appId: "1:160012946248:web:8c3e73100f1e92c485c17d"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const form = document.getElementById("form-login");
    const inputIdent = document.getElementById("rut");
    const inputPass = document.getElementById("password");
    const btnLogin = document.getElementById("btn-login");
    const alertError = document.getElementById("alert-error");
    const alertSuccess = document.getElementById("alert-success");

    // Prellenar si viene en la URL (?rut=... o ?email=...)
    const urlParams = new URLSearchParams(window.location.search);
    const autoIdent = urlParams.get("rut") || urlParams.get("email");
    const autoPass = urlParams.get("password");

    if (autoIdent) inputIdent.value = decodeURIComponent(autoIdent);
    if (autoPass) inputPass.value = decodeURIComponent(autoPass);

    // Si viene con ?logout=true cerramos sesión previa
    if (urlParams.get("logout") === "true") {
      await signOut(auth);
      sessionStorage.removeItem("gravecare_user");
    } else {
      // Si ya hay sesión activa y no se forzó el logout, redirigir
      onAuthStateChanged(auth, (user) => {
        if (user && !autoIdent) {
          window.location.href = "dashboard.html";
        }
      });
    }

    function cleanRut(rut) {
      return rut.toLowerCase().replace(/\./g, "").replace(/\s/g, "");
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      alertError.style.display = "none";
      alertSuccess.style.display = "none";

      const identifier = inputIdent.value.trim();
      const password = inputPass.value;

      if (!identifier || !password) {
        alertError.textContent = "Por favor completa ambos campos.";
        alertError.style.display = "block";
        return;
      }

      try {
        btnLogin.disabled = true;
        btnLogin.querySelector("span").textContent = "Verificando...";

        let email = identifier;

        // Si ingresó RUT, buscar el email correspondiente
        if (!identifier.includes("@")) {
          const rutLimpio = cleanRut(identifier);
          const snapRut = await getDoc(doc(db, "rut_lookup", rutLimpio));
          
          if (!snapRut.exists()) {
            // Intento adicional buscando en colección 'usuarios'
            const qUsers = query(collection(db, "usuarios"), where("rut", "==", identifier));
            const snapUsers = await getDocs(qUsers);
            if (snapUsers.empty) {
              throw new Error("El RUT ingresado no está registrado.");
            }
            email = snapUsers.docs[0].data().email;
          } else {
            email = snapRut.data().email;
          }
        }

        const userCred = await signInWithEmailAndPassword(auth, email, password);
        
        await setDoc(doc(db, "usuarios", userCred.user.uid), {
          lastLogin: serverTimestamp()
        }, { merge: true });

        sessionStorage.setItem("gravecare_user", JSON.stringify({
          uid: userCred.user.uid,
          email: userCred.user.email
        }));

        alertSuccess.textContent = "Acceso correcto. Redirigiendo...";
        alertSuccess.style.display = "block";

        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 800);

      } catch (err) {
        let msg = "Credenciales incorrectas. Verifica tus datos.";
        if (err.code === "auth/invalid-credential" || err.code === "auth/user-not-found" || err.code === "auth/wrong-password") {
          msg = "RUT/Correo o contraseña incorrectos.";
        } else if (err.message) {
          msg = err.message;
        }
        alertError.textContent = msg;
        alertError.style.display = "block";
      } finally {
        btnLogin.disabled = false;
        btnLogin.querySelector("span").textContent = "Ingresar";
      }
    });
  </script>
</body>
</html>
