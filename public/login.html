<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingreso a Mi Perfil — GraveCare Chile</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-[#f7f9f8] min-h-screen flex flex-col text-[#191c1b]">

  <!-- Top Navbar -->
  <header class="bg-white/95 backdrop-blur-md sticky top-0 z-50 border-b border-gray-200">
    <div class="flex justify-between items-center w-full px-6 max-w-7xl mx-auto h-20">
      <a href="index.html" class="flex items-center gap-2">
        <img src="assets/logo.png" alt="GraveCare Logo" class="h-14 w-auto object-contain" onerror="this.onerror=null; this.src='assets/logo.webp';">
      </a>
      <div class="flex items-center gap-2 text-sm">
        <span class="text-gray-600 hidden sm:inline">¿No tienes cuenta?</span>
        <a href="registro.html" class="text-[#002d1a] font-bold hover:underline">Regístrate</a>
      </div>
    </div>
  </header>

  <!-- Contenedor Principal -->
  <main class="flex-grow flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-gray-100 p-8 sm:p-10">
      
      <div class="text-center mb-8">
        <h1 class="text-2xl sm:text-3xl font-extrabold text-[#002d1a]">Ingreso a Mi Perfil</h1>
        <p class="text-gray-500 text-sm mt-2">Ingresa con tu RUT único de cliente</p>
      </div>

      <div id="alertBox" style="display: none;" class="p-4 rounded-xl text-sm font-medium mb-6 transition-all"></div>

      <form id="loginForm" class="space-y-5">
        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase mb-1.5" for="rutTitular">RUT del Titular</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3.5 top-3.5 text-gray-400 text-lg">badge</span>
            <input type="text" id="rutTitular" required placeholder="Ej: 12.345.678-9" maxlength="12"
                   class="w-full pl-10 pr-4 py-3 bg-[#f2f4f2] border border-gray-300 rounded-xl text-sm font-mono focus:bg-white focus:ring-2 focus:ring-[#002d1a] focus:border-[#002d1a] outline-none transition-all">
          </div>
        </div>

        <div>
          <div class="flex justify-between items-center mb-1.5">
            <label class="block text-xs font-bold text-gray-700 uppercase" for="contrasena">Contraseña</label>
            <button type="button" id="btnOlvidoClave" class="text-xs text-[#002d1a] font-semibold hover:underline cursor-pointer">¿Olvidaste tu clave?</button>
          </div>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3.5 top-3.5 text-gray-400 text-lg">lock</span>
            <input type="password" id="contrasena" required placeholder="••••••••" 
                   class="w-full pl-10 pr-11 py-3 bg-[#f2f4f2] border border-gray-300 rounded-xl text-sm focus:bg-white focus:ring-2 focus:ring-[#002d1a] focus:border-[#002d1a] outline-none transition-all">
            <button type="button" id="togglePassword" class="absolute right-3 top-3 text-gray-400 hover:text-gray-700 focus:outline-none cursor-pointer">
              <span class="material-symbols-outlined text-lg select-none" id="iconPassword">visibility</span>
            </button>
          </div>
        </div>

        <button type="submit" id="btnIngresar" 
                class="w-full py-3.5 px-4 bg-[#002d1a] hover:bg-[#1a432f] text-white font-bold rounded-xl shadow-lg transition-all flex items-center justify-center gap-2 text-base cursor-pointer disabled:opacity-60 disabled:cursor-not-allowed">
          <span>Ingresar</span>
          <span class="material-symbols-outlined text-sm font-bold">arrow_forward</span>
        </button>
      </form>

      <div class="text-center mt-8 pt-6 border-t border-gray-100 text-xs text-gray-600">
        ¿Aún no tienes cuenta? <a href="registro.html" class="text-[#002d1a] font-bold hover:underline">Regístrate aquí</a>
      </div>
    </div>
  </main>

  <footer class="text-center text-xs text-gray-500 py-6 border-t border-gray-200">
    GraveCare SpA · Preservación & Memoria · contacto@gravecare.cl · 2026
  </footer>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
    import { getAuth, signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';

    const firebaseConfig = {
      apiKey: "AIzaSyAthgIWiVPDuscljVjQRAX-vIeUYLbrSC0",
      authDomain: "gravecare-2e8d2.firebaseapp.com",
      projectId: "gravecare-2e8d2",
      storageBucket: "gravecare-2e8d2.firebasestorage.app",
      messagingSenderId: "160012946248",
      appId: "1:160012946248:web:8c3e73100f1e92c485c17d"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const inputRut = document.getElementById('rutTitular');
    const inputContrasena = document.getElementById('contrasena');
    const loginForm = document.getElementById('loginForm');
    const btnIngresar = document.getElementById('btnIngresar');
    const alertBox = document.getElementById('alertBox');
    const togglePassword = document.getElementById('togglePassword');
    const iconPassword = document.getElementById('iconPassword');

    function limpiarRut(r) {
      return String(r || '').replace(/[^0-9kK]/g, '').toLowerCase();
    }

    function formatearRut(rut) {
      let valor = limpiarRut(rut).toUpperCase();
      if (valor.length <= 1) return valor;
      const dv = valor.slice(-1);
      let cuerpo = valor.slice(0, -1);
      cuerpo = cuerpo.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
      return `${cuerpo}-${dv}`;
    }

    inputRut.addEventListener('input', () => {
      inputRut.value = formatearRut(inputRut.value);
    });

    togglePassword.addEventListener('click', () => {
      const isPass = inputContrasena.type === 'password';
      inputContrasena.type = isPass ? 'text' : 'password';
      iconPassword.textContent = isPass ? 'visibility_off' : 'visibility';
    });

    function showAlert(mensaje, tipo = 'error') {
      alertBox.className = `p-4 rounded-xl text-sm font-medium mb-6 ${
        tipo === 'error' ? 'bg-red-50 text-red-900 border border-red-200' : 'bg-green-50 text-green-900 border border-green-200'
      }`;
      alertBox.innerHTML = mensaje;
      alertBox.style.display = 'block';
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';

      const rutLimpio = limpiarRut(inputRut.value);
      const contrasena = inputContrasena.value;

      if (!rutLimpio || !contrasena) {
        showAlert('Por favor completa tu RUT y contraseña.');
        return;
      }

      btnIngresar.disabled = true;
      btnIngresar.innerHTML = `<span>Ingresando...</span>`;

      // Autenticación directa por RUT sin depender del correo
      const authEmail = `${rutLimpio}@gravecare.cl`;

      try {
        await signInWithEmailAndPassword(auth, authEmail, contrasena);

        showAlert('✓ Acceso correcto. Redirigiendo a tu portal...', 'success');
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 800);

      } catch (err) {
        console.error('Error de acceso:', err);
        if (err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password') {
          showAlert('Contraseña incorrecta.');
        } else if (err.code === 'auth/user-not-found') {
          showAlert('No encontramos ninguna cuenta registrada para este RUT. Por favor regístrate.');
        } else {
          showAlert('No se pudo iniciar sesión. Verifica tu contraseña.');
        }
      } finally {
        btnIngresar.disabled = false;
        btnIngresar.innerHTML = `<span>Ingresar</span><span class="material-symbols-outlined text-sm font-bold">arrow_forward</span>`;
      }
    });
  </script>
</body>
</html>
