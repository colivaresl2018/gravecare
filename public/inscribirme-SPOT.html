<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visita Especial SPOT | GraveCare - Cuidado Profesional de Sepulturas</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #f8f8f6;
            color: #333;
        }

        header {
            background: white;
            padding: 20px 40px;
            border-bottom: 1px solid #e0e0e0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #1a3a2e;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: #a8d5ba;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        nav a {
            color: #333;
            text-decoration: none;
            margin-left: 30px;
            font-weight: 500;
        }

        nav a:hover {
            color: #1a3a2e;
        }

        .main-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 40px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 42px;
            color: #1a3a2e;
            margin-bottom: 50px;
            text-align: center;
        }

        h2 {
            font-size: 18px;
            color: #1a3a2e;
            margin-bottom: 20px;
            margin-top: 30px;
            font-weight: 600;
        }

        .selector-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            margin-bottom: 50px;
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .selector-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .selector-group label {
            font-weight: 600;
            color: #1a3a2e;
            font-size: 14px;
        }

        .selector-group select {
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            background: white;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        .selector-group select:focus {
            outline: none;
            border-color: #1a3a2e;
            box-shadow: 0 0 0 3px rgba(26, 58, 46, 0.1);
        }

        /* GALERÍA DE IMÁGENES */
        .gallery-section {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 50px;
        }

        .gallery-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }

        .gallery-item {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            text-align: center;
        }

        .gallery-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
        }

        .gallery-item img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }

        .gallery-item-title {
            padding: 20px;
            font-weight: 600;
            color: #1a3a2e;
            background: #f0f4f2;
            font-size: 16px;
        }

        /* RESUMEN Y BOTÓN */
        .summary-section {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-top: 0;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            padding: 16px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .summary-item:last-child {
            border-bottom: none;
        }

        .summary-label {
            color: #666;
            font-weight: 500;
        }

        .summary-value {
            font-weight: 600;
            color: #333;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            padding: 20px 0;
            margin-top: 20px;
            border-top: 2px solid #1a3a2e;
            font-size: 18px;
        }

        .total-row .summary-label {
            font-weight: 700;
            color: #1a3a2e;
        }

        .total-row .summary-value {
            font-size: 24px;
            color: #1a3a2e;
        }

        .button-container {
            display: flex;
            gap: 20px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 16px 32px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Poppins', sans-serif;
        }

        .btn-pagar {
            background: #1a3a2e;
            color: white;
        }

        .btn-pagar:hover {
            background: #0d2621;
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(26, 58, 46, 0.2);
        }

        .btn-volver {
            background: #ddd;
            color: #333;
        }

        .btn-volver:hover {
            background: #ccc;
        }

        .error-message {
            color: #c62828;
            font-size: 14px;
            margin-top: 10px;
            display: none;
            background: #ffebee;
            padding: 12px 16px;
            border-radius: 6px;
            border-left: 4px solid #c62828;
        }

        .error-message.show {
            display: block;
        }

        @media (max-width: 768px) {
            .selector-container {
                grid-template-columns: 1fr;
            }

            .gallery-container {
                grid-template-columns: 1fr;
            }

            .button-container {
                flex-direction: column;
            }

            h1 {
                font-size: 28px;
            }

            .main-content {
                padding: 40px 20px;
            }
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <header>
        <div class="header-container">
            <div class="logo">
                <div class="logo-icon">⚱️</div>
                <span>GraveCare</span>
            </div>
            <nav>
                <a href="/">Inicio</a>
                <a href="/#servicios">Servicios</a>
                <a href="/#contacto">Contacto</a>
            </nav>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        <h1>Visita Especial SPOT</h1>

        <!-- SELECTORES -->
        <div class="selector-container">
            <!-- TIPO DE SERVICIO -->
            <div class="selector-group">
                <label for="tipo">Tipo de Servicio</label>
                <select id="tipo">
                    <option value="">Selecciona tipo de servicio</option>
                    <option value="Limpieza">Limpieza Profunda</option>
                    <option value="Flores">Ornamentación Floral</option>
                </select>
            </div>

            <!-- NIVEL -->
            <div class="selector-group">
                <label for="nivel">Selecciona Nivel de Servicio</label>
                <select id="nivel">
                    <option value="">Selecciona nivel</option>
                    <option value="Standard">Standard ($64.990)</option>
                    <option value="Premium">Premium ($74.990)</option>
                    <option value="Deluxe">Deluxe ($84.990)</option>
                </select>
            </div>
        </div>

        <!-- GALERÍA DE IMÁGENES -->
        <div class="gallery-section">
            <div class="gallery-container">
                <!-- STANDARD -->
                <div class="gallery-item">
                    <img src="Standard.jpg" alt="Standard" onload="console.log('✓ Standard.jpg cargado')" onerror="console.log('✗ Error cargando Standard.jpg')">
                    <div class="gallery-item-title">Standard</div>
                </div>

                <!-- PREMIUM -->
                <div class="gallery-item">
                    <img src="Premium.jpg" alt="Premium" onload="console.log('✓ Premium.jpg cargado')" onerror="console.log('✗ Error cargando Premium.jpg')">
                    <div class="gallery-item-title">Premium</div>
                </div>

                <!-- DELUXE -->
                <div class="gallery-item">
                    <img src="Deluxe.jpg" alt="Deluxe" onload="console.log('✓ Deluxe.jpg cargado')" onerror="console.log('✗ Error cargando Deluxe.jpg')">
                    <div class="gallery-item-title">Deluxe</div>
                </div>
            </div>
        </div>

        <!-- RESUMEN -->
        <div class="summary-section">
            <h2>Resumen</h2>

            <div class="summary-item">
                <span class="summary-label">Tipo de Servicio</span>
                <span class="summary-value" id="summaryTipo">—</span>
            </div>

            <div class="summary-item">
                <span class="summary-label">Nivel</span>
                <span class="summary-value" id="summaryNivel">—</span>
            </div>

            <div class="total-row">
                <span class="summary-label">TOTAL A PAGAR</span>
                <span class="summary-value" id="summaryTotal">$0</span>
            </div>

            <div class="error-message" id="errorMessage"></div>

            <div class="button-container">
                <button class="btn-volver" onclick="window.history.back()">← Volver Atrás</button>
                <button class="btn-pagar" onclick="procederAlPago()">Proceder al Pago</button>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script>
        // ==========================================
        // PRECIOS POR NIVEL (SPOT)
        // ==========================================
        const preciosPorNivel = {
            'Standard': 64990,
            'Premium': 74990,
            'Deluxe': 84990
        };

        // ==========================================
        // ACTUALIZAR RESUMEN
        // ==========================================
        function actualizarResumen() {
            const tipo = document.getElementById('tipo').value;
            const nivel = document.getElementById('nivel').value;

            if (!tipo || !nivel) {
                document.getElementById('errorMessage').classList.remove('show');
                document.getElementById('summaryTipo').textContent = '—';
                document.getElementById('summaryNivel').textContent = '—';
                document.getElementById('summaryTotal').textContent = '$0';
                return;
            }

            const precio = preciosPorNivel[nivel];

            document.getElementById('summaryTipo').textContent = tipo;
            document.getElementById('summaryNivel').textContent = nivel;
            document.getElementById('summaryTotal').textContent = `$${precio.toLocaleString('es-CL')}`;
        }

        // ==========================================
        // PROCEDER AL PAGO
        // ==========================================
        function procederAlPago() {
            const tipo = document.getElementById('tipo').value;
            const nivel = document.getElementById('nivel').value;
            const errorMsg = document.getElementById('errorMessage');

            if (!tipo || !nivel) {
                errorMsg.textContent = 'Por favor, selecciona tipo de servicio y nivel.';
                errorMsg.classList.add('show');
                return;
            }

            const precio = preciosPorNivel[nivel];

            const numeroOrden = 'ORD-SPOT-' + new Date().toISOString().split('T')[0].replace(/-/g, '') + '-' + Math.floor(Math.random() * 1000).toString().padStart(3, '0');

            const orderData = {
                numeroOrden: numeroOrden,
                tipoSuscripcion: 'SPOT',
                tipo: tipo,
                nivel: nivel,
                precio: `$${precio.toLocaleString('es-CL')}`,
                precioNumerico: precio,
                fechaServicio: new Date().toISOString().split('T')[0],
                fechaServicioLegible: new Date().toLocaleDateString('es-CL', { 
                    weekday: 'long', 
                    year: 'numeric', 
                    month: 'long', 
                    day: 'numeric' 
                }),
                timestamp: new Date().toISOString()
            };

            localStorage.setItem('gravecare_last_order', JSON.stringify(orderData));
            console.log('✓ Orden SPOT guardada:', orderData);

            window.location.href = 'confirmacion-pago-firebase.html';
        }

        // ==========================================
        // EVENTOS
        // ==========================================
        document.getElementById('tipo').addEventListener('change', actualizarResumen);
        document.getElementById('nivel').addEventListener('change', actualizarResumen);

        // ==========================================
        // INICIALIZACIÓN
        // ==========================================
        window.addEventListener('DOMContentLoaded', () => {
            console.log('✓ Página SPOT cargada');
            console.log('Intentando cargar imágenes desde: ' + window.location.origin);
        });
    </script>
</body>
</html>
