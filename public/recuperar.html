<!DOCTYPE html>
<html class="light" lang="es">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>GraveCare - Recuperar Contraseña</title>
  
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "background": "#f8faf8",
            "surface-container-lowest": "#ffffff",
            "primary": "#002d1a",
            "secondary": "#4e6451",
            "primary-container": "#1a432f"
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col">

  <header class="bg-surface/90 backdrop-blur-md border-b border-gray-200 docked full-width top-0 sticky z-50">
    <div class="flex justify-between items-center w-full px-6 max-w-6xl mx-auto h-20">
      <a href="index.html" class="flex items-center gap-2">
        <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuDZFDHsSO0piDV5y7OjZwJ3Z4qDx-VUG_2gOzqSlxwrk1BhXTE_9Ip4uFqygIiFXZE0NveBPH37DUyX3FF0QKQlCyIX19okaFshH-gRiZ-5poiU8ZS9VwtB9zh4bdH4TklQeJqawFz5ZY1pu15wPaOiO7JCC_BRnkAUtdHlVSk3uRTDVm-M43vzxiGPd4Sc62Y2mPjqcHirKgcdIyroLD4SkJ1Kxh9DT4R4FOaWt1vH3KYWgwsrT0ph7PrzyWr1SLLNhA" alt="GraveCare Logo" class="h-10 w-auto object-contain">
      </a>
      <a href="login.html" class="text-sm font-semibold text-primary hover:underline">Volver a Iniciar Sesión</a>
    </div>
  </header>

  <main class="flex-grow flex items-center justify-center relative overflow-hidden px-4 py-12">
    <div class="relative z-10 w-full max-w-md">
      <div class="bg-white rounded-2xl border border-gray-200 shadow-xl p-8 md:p-10 flex flex-col items-center">
        
        <div class="text-center mb-6 w-full">
          <div class="w-12 h-12 rounded-full bg-green-100 text-primary flex items-center justify-center mx-auto mb-3">
            <span class="material-symbols-outlined">lock_reset</span>
          </div>
          <h1 class="text-2xl font-bold text-primary mb-2">Recuperar Contraseña</h1>
          <p class="text-sm text-gray-600">Ingresa tu correo electrónico o RUT registrado para enviarte un enlace de restablecimiento seguro.</p>
        </div>

        <!-- Alertas -->
        <div id="alert-error" class="w-full p-3 mb-4 text-sm text-red-700 bg-red-100 rounded-lg border border-red-200" style="display: none;"></div>
        <div id="alert-success" class="w-full p-4 mb-4 text-sm text-green-800 bg-green-50 rounded-lg border border-green-200" style="display: none;"></div>

        <form id="form-recovery" class="w-full space-y-5" novalidate>
          
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1" for="identifier">Correo Electrónico o RUT</label>
            <div class="relative">
              <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">mail</span>
              <input class="w-full pl-10 pr-4 py-3 rounded-lg border border-gray-300 text-gray-900 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent text-sm" id="identifier" placeholder="ejemplo@correo.com o 12.345.678-K" type="text" required autocomplete="email">
            </div>
          </div>

          <button type="submit" id="btn-recovery" class="w-full bg-primary text-white font-semibold py-3.5 px-6 rounded-lg shadow-md hover:bg-primary-container transition-colors duration-300 flex justify-center items-center gap-2 text-sm">
            <span>Enviar Enlace de Recuperación</span>
            <span class="material-symbols-outlined text-sm">send</span>
          </button>
        </form>

        <div class="mt-6 text-center text-sm text-gray-600">
          <a href="login.html" class="text-primary font-bold hover:underline">Volver a Inicio de Sesión</a>
        </div>

      </div>
    </div>
  </main>

  <footer class="footer text-center py-6 text-sm text-gray-500 border-t border-gray-200">
    <p>&copy; 2026 GraveCare Chile SpA.</p>
  </footer>

  <!-- Script de Recuperación -->
  <script type="module">
    import { resetPasswordWithEmail } from "./js/auth.js";

    const form = document.getElementById("form-recovery");
    const inputId = document.getElementById("identifier");
    const btnSubmit = document.getElementById("btn-recovery");
    const alertError = document.getElementById("alert-error");
    const alertSuccess = document.getElementById("alert-success");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      alertError.style.display = "none";
      alertSuccess.style.display = "none";
      alertError.textContent = "";

      const identifier = inputId.value.trim();

      if (!identifier) {
        alertError.textContent = "Por favor ingresa tu correo electrónico o RUT.";
        alertError.style.display = "block";
        return;
      }

      try {
        btnSubmit.disabled = true;
        btnSubmit.querySelector("span").textContent = "Enviando enlace...";

        const sentToEmail = await resetPasswordWithEmail(identifier);

        alertSuccess.innerHTML = `
          <strong>¡Correo enviado con éxito!</strong><br>
          Hemos enviado un enlace de restablecimiento a <b>${sentToEmail}</b>.<br>
          Revisa tu bandeja de entrada (y la carpeta de spam o correo no deseado) y sigue las instrucciones para crear tu nueva contraseña.
        `;
        alertSuccess.style.display = "block";
        form.style.display = "none";

      } catch (err) {
        console.error("Error en recuperación:", err);
        let msg = err.message || "No se pudo procesar la solicitud.";
        
        if (err.code === "auth/user-not-found") {
          msg = "No existe ninguna cuenta registrada con este correo electrónico.";
        } else if (err.code === "auth/invalid-email") {
          msg = "El formato del correo electrónico no es válido.";
        }

        alertError.textContent = msg;
        alertError.style.display = "block";
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.querySelector("span").textContent = "Enviar Enlace de Recuperación";
      }
    });
  </script>

</body>
</html>
