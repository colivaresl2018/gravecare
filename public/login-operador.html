<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GraveCare - Operadores</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto;
      background: linear-gradient(135deg, #1a1f2e 0%, #0f1419 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .box {
      background: #1e2139;
      padding: 50px 40px;
      border-radius: 12px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.08);
    }
    .header {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo { font-size: 48px; margin-bottom: 16px; }
    h1 { color: white; font-size: 28px; font-weight: 700; }
    .badge { background: #4ade80; color: #0f1419; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; margin-top: 12px; display: inline-block; }
    .field { margin-bottom: 20px; }
    label { color: #a0aec0; font-size: 13px; font-weight: 600; margin-bottom: 8px; display: block; text-transform: uppercase; }
    input { width: 100%; padding: 12px 14px; background: #2d3142; border: 1px solid #404656; border-radius: 6px; color: white; font-size: 14px; }
    input:focus { outline: none; border-color: #4ade80; background: #313749; }
    button { width: 100%; padding: 12px; background: #4ade80; color: #0f1419; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; margin-top: 24px; text-transform: uppercase; }
    button:hover { background: #22c55e; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .msg { margin-bottom: 20px; padding: 12px 14px; border-radius: 6px; font-size: 13px; border-left: 4px solid; display: none; }
    .error { background: #7f1d1d; color: #fecaca; border-left-color: #dc2626; }
    .success { background: #1e3a1f; color: #86efac; border-left-color: #22c55e; }
    .info { background: rgba(74,222,128,0.1); border: 1px solid rgba(74,222,128,0.3); color: #86efac; padding: 12px 14px; border-radius: 6px; margin-top: 20px; font-size: 12px; }
  </style>
</head>
<body>

<div class="box">
  <div class="header">
    <div class="logo">🌿</div>
    <h1>GraveCare System</h1>
    <div class="badge">Acceso Operadores</div>
  </div>

  <div id="msg" class="msg"></div>

  <form id="form">
    <div class="field">
      <label>Email Corporativo</label>
      <input type="email" id="email" placeholder="admin@gravecare.cl" required>
    </div>
    <div class="field">
      <label>Contraseña</label>
      <input type="password" id="pass" placeholder="••••••••••" required>
    </div>
    <button type="submit" id="btn">Acceder al Sistema</button>
  </form>

  <div class="info">ℹ️ Sistema Privado - Solo personal autorizado</div>
</div>

<script>
  const form = document.getElementById('form');
  const msg = document.getElementById('msg');
  const btn = document.getElementById('btn');

  form.onsubmit = async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const pass = document.getElementById('pass').value;
    
    btn.disabled = true;
    btn.textContent = 'Procesando...';
    msg.style.display = 'none';

    try {
      const res = await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=AIzaSyAthgIWiVPDuscljVjQRAX-vIeUYLbrSC0', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password: pass, returnSecureToken: true })
      });

      const data = await res.json();

      if (!res.ok) {
        throw new Error(
          data.error.message === 'INVALID_PASSWORD' ? 'Contraseña incorrecta' :
          data.error.message === 'EMAIL_NOT_FOUND' ? 'Email no registrado' :
          data.error.message === 'INVALID_EMAIL' ? 'Email inválido' :
          data.error.message || 'Error desconocido'
        );
      }

      msg.textContent = '✓ Acceso correcto. Redirigiendo...';
      msg.className = 'msg success';
      msg.style.display = 'block';
      
      localStorage.setItem('gravecare_operator', JSON.stringify({
        uid: data.localId,
        email: data.email,
        token: data.idToken
      }));

      setTimeout(() => location.href = '/sistema/', 1500);

    } catch (err) {
      msg.textContent = '❌ ' + err.message;
      msg.className = 'msg error';
      msg.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Acceder al Sistema';
    }
  };
</script>

</body>
</html>
