<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suscripción | GraveCare - Cuidado Profesional de Sepulturas</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #f8f8f6;
            color: #333;
        }

        header {
            background: white;
            padding: 20px 40px;
            border-bottom: 1px solid #e0e0e0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #1a3a2e;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo img {
            height: auto;
            max-width: 100%;
        }

        nav a {
            color: #333;
            text-decoration: none;
            margin-left: 30px;
            font-weight: 500;
        }

        nav a:hover {
            color: #1a3a2e;
        }

        .main-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 40px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 42px;
            color: #1a3a2e;
            margin-bottom: 50px;
            text-align: center;
        }

        h2 {
            font-size: 18px;
            color: #1a3a2e;
            margin-bottom: 20px;
            margin-top: 30px;
            font-weight: 600;
        }

        .selector-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            margin-bottom: 50px;
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .selector-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .selector-group label {
            font-weight: 600;
            color: #1a3a2e;
            font-size: 14px;
        }

        .selector-group select {
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            background: white;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        .selector-group select:focus {
            outline: none;
            border-color: #1a3a2e;
            box-shadow: 0 0 0 3px rgba(26, 58, 46, 0.1);
        }

        /* GALERÍA DE IMÁGENES */
        .gallery-section {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 50px;
        }

        .gallery-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }

        .gallery-item {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            text-align: center;
        }

        .gallery-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
        }

        .gallery-item img {
            width: 100%;
            height: 450px;
            object-fit: contain;
            display: block;
            background: #f5f5f5;
            padding: 20px;
            box-sizing: border-box;
        }

        .gallery-item-title {
            padding: 20px;
            font-weight: 600;
            color: #1a3a2e;
            background: #f0f4f2;
            font-size: 16px;
        }

        /* RESUMEN Y BOTÓN */
        .summary-section {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-top: 0;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            padding: 16px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .summary-item:last-child {
            border-bottom: none;
        }

        .summary-label {
            color: #666;
            font-weight: 500;
        }

        .summary-value {
            font-weight: 600;
            color: #333;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            padding: 20px 0;
            margin-top: 20px;
            border-top: 2px solid #1a3a2e;
            font-size: 18px;
        }

        .total-row .summary-label {
            font-weight: 700;
            color: #1a3a2e;
        }

        .total-row .summary-value {
            font-size: 24px;
            color: #1a3a2e;
        }

        .button-container {
            display: flex;
            gap: 20px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 16px 32px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Poppins', sans-serif;
        }

        .btn-pagar {
            background: #1a3a2e;
            color: white;
        }

        .btn-pagar:hover {
            background: #0d2621;
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(26, 58, 46, 0.2);
        }

        .btn-volver {
            background: #ddd;
            color: #333;
        }

        .btn-volver:hover {
            background: #ccc;
        }

        .error-message {
            color: #c62828;
            font-size: 14px;
            margin-top: 10px;
            display: none;
            background: #ffebee;
            padding: 12px 16px;
            border-radius: 6px;
            border-left: 4px solid #c62828;
        }

        .error-message.show {
            display: block;
        }

        @media (max-width: 768px) {
            .selector-container {
                grid-template-columns: 1fr;
            }

            .gallery-container {
                grid-template-columns: 1fr;
            }

            .button-container {
                flex-direction: column;
            }

            h1 {
                font-size: 28px;
            }

            .main-content {
                padding: 40px 20px;
            }
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <header>
        <div class="header-container">
            <div class="logo">
                <img src="Logo.jpg" alt="GraveCare" style="height: 90px; width: auto;">
            </div>
            <nav>
                <a href="/">Inicio</a>
                <a href="/#servicios">Servicios</a>
                <a href="/#contacto">Contacto</a>
            </nav>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        <h1>Elige tu Plan de Suscripción</h1>

        <!-- SELECTORES -->
        <div class="selector-container">
            <!-- FRECUENCIA -->
            <div class="selector-group">
                <label for="frecuencia">Frecuencia de Pago</label>
                <select id="frecuencia">
                    <option value="">Selecciona frecuencia</option>
                    <option value="Mensual">Mensual ($34.990)</option>
                    <option value="Bimestral">Bimestral ($44.990)</option>
                    <option value="Trimestral">Trimestral ($54.990)</option>
                </select>
            </div>

            <!-- NIVEL -->
            <div class="selector-group">
                <label for="nivel">Selecciona Nivel de Servicio</label>
                <select id="nivel">
                    <option value="">Selecciona nivel</option>
                    <option value="Standard">Standard (sin costo adicional)</option>
                    <option value="Premium">Premium (+$10.000)</option>
                    <option value="Deluxe">Deluxe (+$20.000)</option>
                </select>
            </div>
        </div>

        <!-- GALERÍA DE IMÁGENES -->
        <div class="gallery-section">
            <div class="gallery-container">
                <!-- STANDARD -->
                <div class="gallery-item">
                    <img src="Standard.jpg" alt="Standard" onload="console.log('✓ Standard.jpg cargado')" onerror="console.log('✗ Error cargando Standard.jpg')">
                    <div class="gallery-item-title">Standard</div>
                </div>

                <!-- PREMIUM -->
                <div class="gallery-item">
                    <img src="Premium.jpg" alt="Premium" onload="console.log('✓ Premium.jpg cargado')" onerror="console.log('✗ Error cargando Premium.jpg')">
                    <div class="gallery-item-title">Premium</div>
                </div>

                <!-- DELUXE -->
                <div class="gallery-item">
                    <img src="Deluxe.jpg" alt="Deluxe" onload="console.log('✓ Deluxe.jpg cargado')" onerror="console.log('✗ Error cargando Deluxe.jpg')">
                    <div class="gallery-item-title">Deluxe</div>
                </div>
            </div>
        </div>

        <!-- RESUMEN -->
        <div class="summary-section">
            <h2>Resumen</h2>

            <div class="summary-item">
                <span class="summary-label">Frecuencia</span>
                <span class="summary-value" id="summaryFrecuencia">—</span>
            </div>

            <div class="summary-item">
                <span class="summary-label">Nivel</span>
                <span class="summary-value" id="summaryNivel">—</span>
            </div>

            <div class="summary-item">
                <span class="summary-label">Precio Base</span>
                <span class="summary-value" id="summaryBase">$0</span>
            </div>

            <div class="summary-item">
                <span class="summary-label">Adicional por Nivel</span>
                <span class="summary-value" id="summaryAdicional">$0</span>
            </div>

            <div class="total-row">
                <span class="summary-label">TOTAL MENSUAL</span>
                <span class="summary-value" id="summaryTotal">$0</span>
            </div>

            <div class="error-message" id="errorMessage"></div>

            <div class="button-container">
                <button class="btn-volver" onclick="window.history.back()">← Volver Atrás</button>
                <button class="btn-pagar" onclick="procederAlPago()">Proceder al Pago</button>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script>
        // ==========================================
        // PRECIOS BASE POR FRECUENCIA
        // ==========================================
        const preciosBase = {
            'Mensual': 34990,
            'Bimestral': 44990,
            'Trimestral': 54990
        };

        const adicionalesPorNivel = {
            'Standard': 0,
            'Premium': 10000,
            'Deluxe': 20000
        };

        // ==========================================
        // ACTUALIZAR RESUMEN
        // ==========================================
        function actualizarResumen() {
            const frecuencia = document.getElementById('frecuencia').value;
            const nivel = document.getElementById('nivel').value;

            if (!frecuencia || !nivel) {
                document.getElementById('errorMessage').classList.remove('show');
                document.getElementById('summaryFrecuencia').textContent = '—';
                document.getElementById('summaryNivel').textContent = '—';
                document.getElementById('summaryBase').textContent = '$0';
                document.getElementById('summaryAdicional').textContent = '$0';
                document.getElementById('summaryTotal').textContent = '$0';
                return;
            }

            const precioBase = preciosBase[frecuencia];
            const adicional = adicionalesPorNivel[nivel];
            const total = precioBase + adicional;

            document.getElementById('summaryFrecuencia').textContent = frecuencia;
            document.getElementById('summaryNivel').textContent = nivel;
            document.getElementById('summaryBase').textContent = `$${precioBase.toLocaleString('es-CL')}`;
            document.getElementById('summaryAdicional').textContent = adicional > 0 ? `$${adicional.toLocaleString('es-CL')}` : '$0';
            document.getElementById('summaryTotal').textContent = `$${total.toLocaleString('es-CL')}`;
        }

        // ==========================================
        // PROCEDER AL PAGO
        // ==========================================
        function procederAlPago() {
            const frecuencia = document.getElementById('frecuencia').value;
            const nivel = document.getElementById('nivel').value;
            const errorMsg = document.getElementById('errorMessage');

            if (!frecuencia || !nivel) {
                errorMsg.textContent = 'Por favor, selecciona frecuencia y nivel de servicio.';
                errorMsg.classList.add('show');
                return;
            }

            const precioBase = preciosBase[frecuencia];
            const adicional = adicionalesPorNivel[nivel];
            const total = precioBase + adicional;

            const numeroOrden = 'ORD-' + new Date().toISOString().split('T')[0].replace(/-/g, '') + '-' + Math.floor(Math.random() * 1000).toString().padStart(3, '0');

            const orderData = {
                numeroOrden: numeroOrden,
                tipoSuscripcion: 'SUSCRIPCION',
                frecuencia: frecuencia,
                nivel: nivel,
                precioBase: precioBase,
                adicional: adicional,
                precio: `$${total.toLocaleString('es-CL')}`,
                precioNumerico: total,
                timestamp: new Date().toISOString()
            };

            localStorage.setItem('gravecare_last_order', JSON.stringify(orderData));
            console.log('✓ Orden guardada:', orderData);

            window.location.href = 'confirmacion-pago-firebase.html';
        }

        // ==========================================
        // EVENTOS
        // ==========================================
        document.getElementById('frecuencia').addEventListener('change', actualizarResumen);
        document.getElementById('nivel').addEventListener('change', actualizarResumen);

        // ==========================================
        // INICIALIZACIÓN
        // ==========================================
        window.addEventListener('DOMContentLoaded', () => {
            console.log('✓ Página de suscripción cargada');
            console.log('Intentando cargar imágenes desde: ' + window.location.origin);
        });
    </script>
</body>
</html>
